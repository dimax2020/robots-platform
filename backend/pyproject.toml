[project]
name = "robots-backend"
version = "0.1.0"
description = "Платформа подбора роботизированных решений — бэкенд (engine + api + scripts)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "ortools>=9.11",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "openpyxl>=3.1",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
# Пакет не собирается: engine/, api/, scripts/ импортируются из корня репозитория (WORKDIR /app).
package = false

[tool.pytest.ini_options]
testpaths = ["engine/tests", "api/tests"]
