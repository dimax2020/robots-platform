services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - web
      - platform-api

  web:
    build: ./frontend
    environment:
      NUXT_PUBLIC_PLATFORM_API_BASE: /platform/api/v1
      NUXT_PLATFORM_API_UPSTREAM: http://platform-api:8000
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.priority=1
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.services.web.loadbalancer.server.port=3000

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: robots
      POSTGRES_PASSWORD: robots
      POSTGRES_DB: robots
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robots -d robots"]
      interval: 5s
      timeout: 3s
      retries: 10

  platform-api:
    build: ./platform
    environment:
      DATABASE_URL: postgresql+psycopg://robots:robots@db:5432/platform
      POSTGRES_ADMIN_URL: postgresql+psycopg://robots:robots@db:5432/postgres
      UPLOAD_DIR: /app/uploads
      ROOT_PATH: /platform
    volumes:
      - platform_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.platform.rule=PathPrefix(`/platform`)
      - traefik.http.routers.platform.priority=20
      - traefik.http.routers.platform.entrypoints=web
      - traefik.http.middlewares.platform-strip.stripprefix.prefixes=/platform
      - traefik.http.routers.platform.middlewares=platform-strip
      - traefik.http.services.platform.loadbalancer.server.port=8000

  platform-worker:
    build: ./platform
    command: ["sh", "-c", "python -m app.bootstrap && python -m app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://robots:robots@db:5432/platform
      POSTGRES_ADMIN_URL: postgresql+psycopg://robots:robots@db:5432/postgres
      UPLOAD_DIR: /app/uploads
    volumes:
      - platform_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  platform_uploads:
